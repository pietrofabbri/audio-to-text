# Pannello cifrato: costruisce la pagina dalle metriche del corpus, la cifra
# con StatiCrypt e la pubblica su GitHub Pages da una repo pubblica separata.
#
# Va copiato nella repo PRIVATA del corpus come
#   .github/workflows/pannello.yml
# (la copia ufficiale sta in pietrofabbri/audio-to-text, pannello/pannello.yml).
#
# Segreti da impostare nella repo del corpus (Settings → Secrets and
# variables → Actions):
#   PANNELLO_PASSWORD  la frase d'accesso. Lunga, di parole casuali: e' l'unica
#                      protezione, perche' la pagina cifrata e' pubblica.
#   PANNELLO_TOKEN     token fine-grained con permesso "Contents: read and
#                      write" SOLO sulla repo pubblica del pannello.
#
# Variabile (Settings → Secrets and variables → Actions → Variables):
#   PANNELLO_REPO      la repo pubblica, es. pietrofabbri/taccuino
#
# Regole (documento di progetto analisi-corpus.md, sezione 8):
# - il calcolo resta sul Mac: qui si disegna soltanto, da metriche/*.json;
# - una pagina sola con i dati dentro: StatiCrypt cifra la pagina, non i
#   file accanto;
# - il ramo pubblicato si riscrive da zero a ogni build (un commit solo),
#   cosi' nessuna versione vecchia resta nella storia;
# - nomi, titoli e indirizzi neutri; robots.txt che chiede di non indicizzare.

name: pannello

on:
  push:
    branches: [main]
    paths: ["metriche/**", "giorni/**", ".github/workflows/pannello.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pannello
  cancel-in-progress: true

jobs:
  costruisci:
    runs-on: ubuntu-latest
    steps:
      - name: Metriche e giornate del corpus
        uses: actions/checkout@v5
        with:
          sparse-checkout: |
            metriche
            giorni
            pannello
          path: corpus

      - name: Codice del pannello (repo pubblica della pipeline)
        uses: actions/checkout@v5
        with:
          repository: pietrofabbri/audio-to-text
          sparse-checkout: |
            core
            pannello
          path: pipeline

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Finche' i segreti non ci sono il workflow non fallisce: avvisa e non
      # pubblica niente. Il corpus si pubblica ogni notte, e un errore rosso
      # ogni notte prima della configurazione sarebbe solo rumore.
      - name: Controlla i segreti
        id: segreti
        env:
          PASS: ${{ secrets.PANNELLO_PASSWORD }}
          TOKEN: ${{ secrets.PANNELLO_TOKEN }}
          REPO: ${{ vars.PANNELLO_REPO }}
        run: |
          manca=""
          test -n "$PASS"  || manca="$manca PANNELLO_PASSWORD"
          test -n "$TOKEN" || manca="$manca PANNELLO_TOKEN"
          test -n "$REPO"  || manca="$manca PANNELLO_REPO(variabile)"
          if [ -n "$manca" ]; then
            echo "::warning::pannello non pubblicato, manca:$manca"
            echo "pronto=no" >> "$GITHUB_OUTPUT"; exit 0
          fi
          test ${#PASS} -ge 20 || { echo "::error::PANNELLO_PASSWORD troppo corta (almeno 20 caratteri)"; exit 1; }
          echo "pronto=si" >> "$GITHUB_OUTPUT"

      # Pannello (index.html) e una pagina di conversazioni per giorno
      # (giorni/AAAA-MM-GG.html), tutte con i dati dentro.
      - name: Costruisci le pagine in chiaro (restano nel runner)
        if: steps.segreti.outputs.pronto == 'si'
        env:
          # Le pagine delle conversazioni (testo integrale) escono sempre,
          # tranne se la variabile PANNELLO_CONVERSAZIONI vale «no» (dal 23/10:
          # prima serviva «si», ma cambiare una variabile non fa ripartire il
          # workflow e le pagine non uscivano). In tutte le pagine i
          # nomi di persona escono con le iniziali, tranne quelli elencati in
          # pannello/nomi_in_chiaro.txt del corpus (decisione del 21/10:
          # si tengono anche le ore di lezione, i minorenni solo a iniziali;
          # pannello/iniziali.py).
          CONVERSAZIONI: ${{ vars.PANNELLO_CONVERSAZIONI }}
        run: |
          if [ "$CONVERSAZIONI" != "no" ]; then
            python pipeline/pannello/costruisci.py corpus/metriche chiaro/index.html corpus/giorni
          else
            python pipeline/pannello/costruisci.py corpus/metriche chiaro/index.html corpus/giorni --senza-conversazioni
            mkdir -p chiaro/giorni
          fi

      - name: Cifra
        if: steps.segreti.outputs.pronto == 'si'
        env:
          STATICRYPT_PASSWORD: ${{ secrets.PANNELLO_PASSWORD }}
        run: |
          # Il sale e' pubblico (sta nella pagina) e fisso: cosi' «Ricordami»
          # sopravvive alle ricostruzioni notturne.
          # Tutte le pagine con la stessa frase e lo stesso sale: con
          # «Ricordami» la frase si inserisce una volta e le pagine dei
          # giorni si aprono da sole.
          cd chiaro
          pagine="index.html"
          ls giorni/*.html >/dev/null 2>&1 && pagine="index.html giorni"
          npx --yes staticrypt@3.5.4 $pagine -r -d ../sito \
            --salt 6c8e0a4f2b7d4e19a3c51f0d8b62e7a4 \
            --config false --short --remember 30 \
            --template-title "Taccuino" \
            --template-button "Apri" \
            --template-placeholder "Frase d'accesso" \
            --template-remember "Ricordami per 30 giorni" \
            --template-error "Frase sbagliata" \
            --template-color-primary "#1b1b19" \
            --template-color-secondary "#f6f5f1"
          cd ..
          printf 'User-agent: *\nDisallow: /\n' > sito/robots.txt
          touch sito/.nojekyll
          cp pipeline/pannello/icona.png sito/icona.png

      # Per il telefono: icona e nome quando si aggiunge alla schermata
      # Home. Va nella pagina d'accesso (fuori dalla cifratura): contiene
      # solo il nome neutro e l'icona.
      - name: Icona e meta per il telefono
        if: steps.segreti.outputs.pronto == 'si'
        env:
          REPO: ${{ vars.PANNELLO_REPO }}
        run: |
          base="/${REPO#*/}"
          meta="<meta name=\"theme-color\" content=\"#1b1b19\"><meta name=\"apple-mobile-web-app-title\" content=\"Taccuino\"><meta name=\"apple-mobile-web-app-capable\" content=\"yes\"><meta name=\"mobile-web-app-capable\" content=\"yes\"><link rel=\"apple-touch-icon\" href=\"${base}/icona.png\"><link rel=\"icon\" type=\"image/png\" href=\"${base}/icona.png\">"
          find sito -name '*.html' -print0 | xargs -0 sed -i "0,/<head>/s|<head>|<head>${meta}|"

      # Nessun file in chiaro esce: solo pagine cifrate, l'icona e due file
      # di servizio.
      - name: Controlla che niente sia in chiaro
        if: steps.segreti.outputs.pronto == 'si'
        run: |
          find sito -type f | sort
          ! find sito -type f ! -name '*.html' ! -name robots.txt ! -name .nojekyll ! -name icona.png | grep .
          ! grep -rl "taccuino-in-chiaro" sito
          for f in $(find sito -name '*.html'); do grep -q staticrypt "$f" || { echo "::error::$f non cifrata"; exit 1; }; done

      - name: Pubblica (un commit solo, storia riscritta)
        if: steps.segreti.outputs.pronto == 'si'
        env:
          TOKEN: ${{ secrets.PANNELLO_TOKEN }}
          REPO: ${{ vars.PANNELLO_REPO }}
        run: |
          cd sito
          git init -q -b gh-pages
          git config user.name "pannello"
          git config user.email "pannello@users.noreply.github.com"
          git add -A
          git commit -q -m "pagina"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${REPO}.git" gh-pages
